name: release

# A pushed v* tag becomes a GitHub Release with its CHANGELOG entry, so the
# Releases page and the tag the paper was built from never drift apart
# (2026-10-26: v1.0.2 was tagged and published without a release, and the
# Releases page kept 1.0.1 as latest). Runs for seconds; hosted is the
# allowed exception for a release step that must not wait on the pool.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Notes from CHANGELOG.md
        # The script refuses a tag whose CHANGELOG entry still says draft, and one CITATION.cff
        # doesn't cite yet, so a tag pushed early publishes nothing. It uses no dependencies.
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          test -s notes.md || { echo "no CHANGELOG entry for $GITHUB_REF_NAME"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --title "AI Use Levels ${GITHUB_REF_NAME#v}" --latest --notes-file notes.md
