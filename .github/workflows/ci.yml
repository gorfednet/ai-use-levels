name: ci

# This repository is public, so CI runs on GitHub-hosted runners only.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Named to match the check the main branch protection requires ("ci / test").
    name: ci / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tokens-stable compares HEAD against every v* tag, so the tags must be present.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        if: ${{ !cancelled() }}
      - name: AI-Use trailers on the pull request's commits
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-trailers.mjs --range "$BASE_SHA..$HEAD_SHA"
